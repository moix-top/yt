<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mi Patrimonio">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a78d6"/>
      <stop offset="100%" stop-color="#1baf7a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0f1a26"/>
  <!-- Anillo tipo donut: el mismo lenguaje visual que el gráfico principal.
       Trazo grueso y hueco amplio para que a 16px se lea como anillo. -->
  <circle cx="32" cy="32" r="17" fill="none" stroke="url(#g)" stroke-width="11"/>
  <!-- Segmento destacado: un cuarto de la vuelta, separado del resto. -->
  <circle cx="32" cy="32" r="17" fill="none" stroke="#f4f4f2" stroke-width="11"
          stroke-dasharray="26.7 80.1" stroke-dashoffset="-2" transform="rotate(-90 32 32)"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="#eda100" stroke-width="11"
          stroke-dasharray="23.7 83.1" stroke-dashoffset="-3.5" transform="rotate(-90 32 32)"/>
</svg>
