name: Android (fork de NewPipe)

# Cada día mira si NewPipe ha publicado versión. Si la hay —o si cambia algo en
# android/—, monta el fork (upstream + overlay + parches), lo compila, lo firma y
# lo publica como Release de GitHub. Obtainium en el móvil vigila esas Releases.
#
# Si un parche no aplica o la compilación falla y existe el secreto GLM_API_KEY,
# se le pide el arreglo a GLM y el resultado llega como PR: NUNCA se publica un
# APK con código escrito por la IA sin que lo revise una persona.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de NewPipe (vacío = última release)'
        required: false
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: ¿Hay algo que hacer?
        id: version
        run: |
          pinned=$(cat android/UPSTREAM_VERSION)
          latest="${{ inputs.tag }}"
          [ -z "$latest" ] && latest=$(gh api repos/TeamNewPipe/NewPipe/releases/latest --jq .tag_name)
          echo "pinned=$pinned latest=$latest"
          echo "tag=$latest" >> "$GITHUB_OUTPUT"
          echo "new=$([ "$latest" != "$pinned" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # En el cron diario, sin versión nueva no se hace nada.
          if [ "${{ github.event_name }}" = schedule ] && [ "$latest" = "$pinned" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.version.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.skip != 'true'

      - name: Montar el árbol
        id: prepare
        if: steps.version.outputs.skip != 'true'
        run: |
          mkdir -p android/build
          set +e
          android/scripts/prepare.sh "${{ steps.version.outputs.tag }}" 2>&1 | tee android/build/apply.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Arreglar parches con IA
        id: aifix_patch
        if: steps.prepare.outputs.code == '2'
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_BASE_URL: ${{ vars.GLM_BASE_URL }}
          GLM_MODEL: ${{ vars.GLM_MODEL }}
        run: |
          [ -n "$GLM_API_KEY" ] || { echo "::error::Parches rotos y sin GLM_API_KEY"; exit 1; }
          python3 -I android/scripts/ai_fix.py --mode patch --log android/build/apply.log
          echo "used=true" >> "$GITHUB_OUTPUT"

      - name: Compilar
        id: build
        if: steps.version.outputs.skip != 'true' && (steps.prepare.outputs.code == '0' || steps.aifix_patch.outputs.used == 'true')
        working-directory: android/upstream
        run: |
          set +e
          ./gradlew assembleRelease --no-daemon 2>&1 | tee ../build/assemble.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # Hasta dos rondas: error → GLM reescribe el overlay → se recompila.
      - name: Arreglar compilación con IA
        id: aifix_build
        if: steps.build.outputs.code != '' && steps.build.outputs.code != '0'
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_BASE_URL: ${{ vars.GLM_BASE_URL }}
          GLM_MODEL: ${{ vars.GLM_MODEL }}
        run: |
          [ -n "$GLM_API_KEY" ] || { echo "::error::No compila y no hay GLM_API_KEY"; exit 1; }
          for round in 1 2; do
            python3 -I android/scripts/ai_fix.py --mode build --log android/build/assemble.log
            cp -r android/overlay/. android/upstream/
            if (cd android/upstream && ./gradlew assembleRelease --no-daemon 2>&1 | tee ../build/assemble.log; exit ${PIPESTATUS[0]}); then
              echo "used=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "::error::La IA no consiguió que compile. Revisa android/build/assemble.log"
          exit 1

      - name: PR con el arreglo de la IA
        if: steps.aifix_patch.outputs.used == 'true' || steps.aifix_build.outputs.used == 'true'
        run: |
          tag="${{ steps.version.outputs.tag }}"
          branch="ai/newpipe-$tag-${{ github.run_id }}"
          echo "$tag" > android/UPSTREAM_VERSION
          git config user.email "yt-bot@moix.top"; git config user.name "yt-bot"
          git checkout -b "$branch"
          git add android/UPSTREAM_VERSION android/patches android/overlay
          git commit -m "Adapta el fork a NewPipe $tag (propuesto por GLM)"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "NewPipe $tag: adaptación propuesta por IA" \
            --body "El fork no aplicaba o no compilaba con NewPipe $tag y GLM ha propuesto este cambio. Compila en CI, pero **revísalo**: al fusionarlo se publica el APK."
          echo "Abierto PR; no se publica APK hasta fusionarlo."

      - name: Firmar y publicar
        if: steps.build.outputs.code == '0' && steps.aifix_patch.outputs.used != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Compila, pero no hay clave de firma (android/scripts/setup-signing.sh): no se publica."
            exit 0
          fi
          tag="${{ steps.version.outputs.tag }}"
          unsigned=$(ls android/upstream/app/build/outputs/apk/release/*-unsigned.apk | head -1)
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          echo "$KEYSTORE_B64" | base64 -d > /tmp/yt.jks
          out="yt-${tag}-${{ github.run_number }}.apk"
          "$apksigner" sign --ks /tmp/yt.jks --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out "$out" "$unsigned"
          rm /tmp/yt.jks
          gh release create "android-${tag}-${{ github.run_number }}" "$out" \
            --title "yt ${tag} (#${{ github.run_number }})" \
            --notes "NewPipe ${tag} + sincronización yt.moix.top."
          # Fija la versión publicada para que el cron de mañana no repita.
          if [ "${{ steps.version.outputs.new }}" = true ]; then
            echo "$tag" > android/UPSTREAM_VERSION
            git config user.email "yt-bot@moix.top"; git config user.name "yt-bot"
            git add android/UPSTREAM_VERSION
            git commit -m "Sube el fork a NewPipe $tag"
            git push origin HEAD:main
          fi
