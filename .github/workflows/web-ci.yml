name: Web CI

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-ci.yml']
  pull_request:
    paths: ['web/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Modo memoria: sin AWS ni Google.
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          AUTH_SECRET: dummy-secret-for-build-only
          AUTH_GOOGLE_ID: dummy
          AUTH_GOOGLE_SECRET: dummy
          AUTH_TRUST_HOST: 'true'
